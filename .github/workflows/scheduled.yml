name: scheduled

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-qbittorrent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - run: scripts/test-qbittorrent

  performance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - run: scripts/test-performance

  fuzz:
    runs-on: ubuntu-24.04
    container: docker.io/library/rust:1.98-bookworm@sha256:e70e2eec3d495fd5c8e0be74adda86507dfac7f51a724fbf9813ff59b2b247c7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-08-23 --profile minimal
          cargo install --locked --version 0.13.2 cargo-fuzz
      - run: cargo +nightly-2026-08-23 fuzz run torrent -- -max_total_time=600 -rss_limit_mb=1024
      - run: cargo +nightly-2026-08-23 fuzz run torznab -- -max_total_time=600 -rss_limit_mb=1024

  soak:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - run: scripts/soak
