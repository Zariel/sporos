name: container

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a release tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sporos
          TAG: ${{ github.ref_name }}
        run: |
          release_image="${IMAGE,,}:${TAG#v}"
          error_file="$(mktemp)"
          if docker manifest inspect "$release_image" 2>"$error_file"; then
            echo "release image already exists: $release_image" >&2
            exit 1
          fi
          if ! grep --extended-regexp --quiet 'manifest unknown|no such manifest' "$error_file"; then
            cat "$error_file" >&2
            exit 1
          fi

  image:
    if: >-
      !cancelled() &&
      (needs.release-tag.result == 'success' || needs.release-tag.result == 'skipped') &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository)
    needs: release-tag
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.event_name == 'push' }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: sporos-container
      sbom: true
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository_owner }}/sporos
      meta-flavor: latest=false
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
