name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    container: docker.io/library/rust:1.98-bookworm@sha256:e70e2eec3d495fd5c8e0be74adda86507dfac7f51a724fbf9813ff59b2b247c7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install check tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ripgrep
          rustup component add clippy rustfmt
          cargo install --locked --version 0.9.143 cargo-nextest
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.22.2 cargo-audit
      - run: scripts/check

  fuzz-smoke:
    runs-on: ubuntu-24.04
    container: docker.io/library/rust:1.98-bookworm@sha256:e70e2eec3d495fd5c8e0be74adda86507dfac7f51a724fbf9813ff59b2b247c7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-08-23 --profile minimal
          cargo install --locked --version 0.13.2 cargo-fuzz
      - run: scripts/fuzz

  image-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/test-image
