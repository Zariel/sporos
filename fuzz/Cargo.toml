[package]
name = "sporos-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
magpie-bt-bencode = { path = "../vendor/magpie-bt-bencode" }
magpie-bt-metainfo = "=0.1.3"
quick-xml = { version = "=0.42.0", features = ["async-tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sporos-matcher = { path = "../crates/sporos-matcher" }
sporos-model = { path = "../crates/sporos-model" }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util"] }

[patch.crates-io]
magpie-bt-bencode = { path = "../vendor/magpie-bt-bencode" }

[[bin]]
name = "torrent"
path = "fuzz_targets/torrent.rs"
test = false
doc = false
bench = false

[[bin]]
name = "torznab"
path = "fuzz_targets/torznab.rs"
test = false
doc = false
bench = false

[[bin]]
name = "release"
path = "fuzz_targets/release.rs"
test = false
doc = false
bench = false

[[bin]]
name = "matcher"
path = "fuzz_targets/matcher.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
