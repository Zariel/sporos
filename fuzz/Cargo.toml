[package]
name = "sporos-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
magpie-bt-bencode = { path = "../vendor/magpie-bt-bencode" }
magpie-bt-metainfo = "=0.1.3"
quick-xml = "=0.42.0"
thiserror = "=2.0.20"

[patch.crates-io]
magpie-bt-bencode = { path = "../vendor/magpie-bt-bencode" }

[[bin]]
name = "torrent"
path = "fuzz_targets/torrent.rs"
test = false
doc = false
bench = false

[[bin]]
name = "torznab"
path = "fuzz_targets/torznab.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
