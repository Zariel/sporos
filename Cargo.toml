[workspace]
exclude = ["fuzz", "vendor/duroxide", "vendor/magpie-bt-bencode"]
members = [
  "crates/sporos-matcher",
  "crates/sporos-model",
  "crates/sporos-service",
  "crates/sporos-testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Zariel/sporos"
rust-version = "1.98"

[workspace.dependencies]
duroxide = { version = "=0.1.30", features = ["sqlite"] }
duroxide-sqlx = { package = "sqlx", version = "=0.8.6", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
] }
fs2 = "=0.4.3"
magpie-bt-bencode = "=0.1.3"
magpie-bt-metainfo = "=0.1.3"
quick-xml = "=0.42.0"
reqwest = { version = "=0.13.4", default-features = false, features = [
  "form",
  "multipart",
  "query",
  "rustls",
] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite-bundled",
] }
sporos-matcher = { path = "crates/sporos-matcher" }
sporos-model = { path = "crates/sporos-model" }
sporos-service = { path = "crates/sporos-service" }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
toml = "=1.1.4"

[patch.crates-io]
duroxide = { path = "vendor/duroxide" }
magpie-bt-bencode = { path = "vendor/magpie-bt-bencode" }

[workspace.lints.rust]
unsafe_code = "deny"
