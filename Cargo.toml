[workspace]
members = [
  "crates/sporos-matcher",
  "crates/sporos-model",
  "crates/sporos-service",
  "crates/sporos-testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Zariel/sporos"
rust-version = "1.98"

[workspace.dependencies]
fs2 = "=0.4.3"
sqlx = { version = "=0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite-bundled",
] }
sporos-matcher = { path = "crates/sporos-matcher" }
sporos-model = { path = "crates/sporos-model" }
sporos-service = { path = "crates/sporos-service" }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "deny"
