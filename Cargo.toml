[workspace]
exclude = ["fuzz", "vendor/duroxide", "vendor/magpie-bt-bencode"]
members = [
  "crates/sporos-matcher",
  "crates/sporos-model",
  "crates/sporos-service",
  "crates/sporos-testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Zariel/sporos"
rust-version = "1.98"

[workspace.dependencies]
axum = "=0.8.9"
base64 = "=0.22.1"
clap = { version = "=4.6.6", features = ["derive", "env"] }
duroxide = { version = "=0.1.30", features = ["sqlite"] }
duroxide-sqlx = { package = "sqlx", version = "=0.8.6", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
] }
fs2 = "=0.4.3"
magpie-bt-bencode = "=0.1.3"
magpie-bt-metainfo = "=0.1.3"
futures-util = "=0.3.32"
quick-xml = { version = "=0.42.0", features = ["async-tokio"] }
reqwest = { version = "=0.13.4", default-features = false, features = [
  "form",
  "multipart",
  "query",
  "rustls",
  "stream",
] }
proptest = "=1.11.0"
rustix = { version = "=1.1.4", features = ["fs"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.9.0", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite-bundled",
] }
sporos-matcher = { path = "crates/sporos-matcher" }
sporos-model = { path = "crates/sporos-model" }
sporos-service = { path = "crates/sporos-service" }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "=0.7.18", features = ["io"] }
toml = "=1.1.4"
tower = { version = "=0.5.3", features = ["limit", "timeout", "util"] }
tower-http = { version = "=0.6.11", features = ["limit", "timeout"] }
subtle = "=2.6.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "=0.1.25"

[patch.crates-io]
duroxide = { path = "vendor/duroxide" }
magpie-bt-bencode = { path = "vendor/magpie-bt-bencode" }

[workspace.lints.rust]
unsafe_code = "deny"
